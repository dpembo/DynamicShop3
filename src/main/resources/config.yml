Language: en-US
Prefix: §3DShop3 §7| §f
Command.UseShopCommand: true
Command.OpenStartPageInsteadOfDefaultShop: true
Command.DefaultShopName: SampleShop
Command.PermissionCheckWhenCreatingAShopList: false
Shop.SalesTax: 25
Shop.DeliveryChargeScale: 0.3
Shop.DeliveryChargeMin: 1
Shop.DeliveryChargeMax: 25
Shop.NumberOfPlayer: 10
Shop.UseLegacyStockStabilization: false
UI.DisplayStockAsStack: false
UI.OpenStartPageWhenClickCloseButton: true
UI.CloseButtonIcon : BARRIER
UI.PageButtonIcon : PAPER
UI.ShopInfoButtonIcon : OAK_SIGN
UI.BalanceButtonIcon : EMERALD
UI.SellToggleButtonIcon : GREEN_STAINED_GLASS
UI.BuyToggleButtonIcon : RED_STAINED_GLASS
UI.EnableStackTrade: true
UI.MaxStackTradeAmount: 64
UI.StackTradeIcon : CHEST
UI.IntFormat: '###,###'
UI.DoubleFormat: '###,##0.00'
# Prefix shown on Vault (money) prices in GUIs, e.g. $ → $1.25. Leave empty for no symbol.
# Not applied to Job Points, PlayerPoints, Exp, or MultiCurrency (those use their own format).
UI.CurrencySymbol: '$'
# When a buy is reduced because the player cannot afford the full amount, show OK/Cancel
# before taking their money (avoids spending everything by accident).
UI.ConfirmPartialBuy: true
UI.LocalizedItemName: true
UI.UsePlaceholderAPI : true
UI.UseHexColorCode : true
UI.EnableInventoryClickSearch.StartPage: true
UI.EnableInventoryClickSearch.Shop: true
Log.SaveLogs: true
Log.LogFileNameFormat: MM_dd_yyyy
Log.CullLogs: true
Log.LogCullAgeMinutes: 7200
Log.LogCullTimeMinutes: 120
ShopYmlBackup.Enable: true
ShopYmlBackup.IntervalMinutes: 60
ShopYmlBackup.CullAgeMinutes: 300